# XcodeGen spec for a FREE Apple ID (Personal Team): same app without the Password AutoFill extension.
# Generate with: xcodegen generate --spec project-free.yml
# Original header: The generated SaveKey.xcodeproj is included; regenerate with `xcodegen` after editing.
# Your bundle ID and team go in SaveKey-Signing.xcconfig next to the SaveKey folder (see Config/Signing.xcconfig).
name: SaveKey-Free
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  xcodeVersion: "27.2"  # recommended settings of Xcode 27.2 applied (LastUpgradeCheck)

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(BUNDLE_ID_BASE).shared
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  KeePassCore:
    path: Packages/KeePassCore

targets:
  SaveKey:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Info-Free.plist"
          - "*.entitlements"
      - path: Shared
    dependencies:
      - package: KeePassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        # iPhone only (XcodeGen's iOS preset would otherwise add iPad, which needs every orientation).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info-Free.plist
      properties:
        CFBundleDisplayName: SaveKey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: false
        NSFaceIDUsageDescription: SaveKey uses Face ID to unlock your password databases.
        NSCameraUsageDescription: SaveKey uses the camera to digitize payment cards and to scan QR codes for one-time passwords. Images are processed on this iPhone.
        NSPhotoLibraryUsageDescription: Choose an image to use as a custom entry icon.
        # Translations included (Shared/Localization). Users can pick SaveKey's language in the app's settings
        # or in iPhone Settings › Apps › SaveKey › Language, which is shown even with one iPhone language.
        CFBundleLocalizations: [en, de, es, fr, it, pt-BR, pt-PT]
        UIPrefersShowingLanguageSettings: true
        KCAppGroupIdentifier: $(APP_GROUP_ID)
        KCKeychainAccessGroup: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: KeePass Database
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.keepass.kdbx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.keepass.kdbx
            UTTypeDescription: KeePass Database
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - kdbx
              public.mime-type:
                - application/x-keepass2

schemes:
  SaveKey:
    build:
      targets:
        SaveKey: all
    run:
      config: Debug
    archive:
      config: Release
